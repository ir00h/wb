[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
wb-model = { path = "crates/model" }
wb-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
tauri = "2.12"
tauri-build = "2"
tiny_http = "0.12"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
block2 = "0.6"
serde_json = "1"
thiserror = { version = "2", default-features = false }
ts-rs = { version = "12.0", features = ["no-serde-warnings"] }
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
ra-ap-rustc_lexer = "0.185"
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = "1"
syn = { version = "2", features = ["full", "visit"] }
oxc_allocator = "0.110"
oxc_parser = "0.110"
oxc_span = "0.110"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
