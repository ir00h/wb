[package]
name = "whiteboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "whiteboard"
path = "src/main.rs"

[features]
automation = [
  "dep:serde",
  "dep:tiny_http",
  "dep:block2",
  "dep:objc2-foundation",
  "dep:rustix",
]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
notify.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
tauri.workspace = true
tiny_http = { workspace = true, optional = true }
wb-core.workspace = true
wb-model.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true, features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
objc2.workspace = true
objc2-foundation = { workspace = true, optional = true, features = ["std", "NSData", "NSGeometry", "NSRange", "NSString"] }

[lints]
workspace = true
